# llama-swap's configuration, generated by ai-ctl from its inventory.
# `ai-ctl up` writes it again: change the inventory instead.

# The gateway's log keeps the models' output too: llama-swap holds it in
# memory only otherwise, and loses it when it stops.
logToStdout: "proxy,upstream"

# Every request but /health needs ai-ctl's API key, which `ai-ctl up` passes to
# llama-swap in its environment, and llama-swap to each backend in its own.
apiKeys: ["${env.AI_CTL_API_KEY}"]

models:
  "qwen3.8-27b":
    cmd: |
      /home/user/.local/share/ai-ctl/builds/llama.cpp/b11538/llama-server
      --host 127.0.0.1
      --port ${PORT}
      --alias qwen3.8-27b
      --metrics
      --model /ai/models/llm/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_M.gguf
      --mmproj /ai/models/llm/qwen3.8-27b/mmproj-F16.gguf
      --model-draft /ai/models/llm/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
      --ctx-size 98304
      --batch-size 2048
      --cache-ram 16384
      --cache-type-k q8_0
      --cache-type-v q8_0
      --fit-target 1024
      --flash-attn on
      --min-p 0
      --no-mmproj-offload
      --parallel 1
      --presence-penalty 0
      --reasoning-effort medium
      --repeat-penalty 1
      --spec-draft-n-max 2
      --spec-type draft-mtp
      --temp 0.6
      --top-k 20
      --top-p 0.95
      --ubatch-size 1024
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: "/health"
    env:
      - "LLAMA_API_KEY=${env.AI_CTL_API_KEY}"
    ttl: 1800
    # llama-server advertises keep-alive on a streamed response, then closes the
    # connection: a request sent right after reuses it and fails with 502
    # "proxy error: EOF" (llama-swap #1205). Needed until llama.cpp fixes #29680.
    disableKeepAlives: true
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 98304
    capacities:
      vram: 22733
    evict_cost: 22733
